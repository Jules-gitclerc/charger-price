name: migrations

# Authoritative gate: apply every supabase/migrations/*.sql file IN ORDER
# against an empty Postgres + PostGIS container, then re-apply each
# migration a second time to assert idempotency. Catches the class of
# bugs that pre-commit sqlfluff cannot (semantic / cross-migration /
# constraint-validation), per T04 brief side-commit decision.
#
# SECURITY NOTE: this workflow does NOT use any github.event.* untrusted
# inputs in run: blocks. Triggers are limited to PRs to main and pushes
# to non-main branches; both run only the deterministic migration files
# checked into the repo. No issue/PR title/body/comment substitution.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations.yml'
      - '.sqlfluff'
  push:
    branches-ignore: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations.yml'
      - '.sqlfluff'

jobs:
  lint:
    name: sqlfluff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sqlfluff
        # Pin major version (4.x). Local dev uses Homebrew which tracks
        # latest; CI pins to keep the gate deterministic.
        run: pip install 'sqlfluff>=4,<5'
      - name: Lint migrations
        run: sqlfluff lint supabase/migrations/

  apply:
    name: apply + idempotency
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        # postgis/postgis:15-3.4 mirrors the Supabase prix-bornes runtime
        # (Postgres 15 + PostGIS 3.x). pgcrypto is bundled with all
        # contrib so no extra install needed.
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: prixbornes
          POSTGRES_PASSWORD: prixbornes
          POSTGRES_DB: prixbornes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prixbornes -d prixbornes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: prixbornes
      PGPASSWORD: prixbornes
      PGDATABASE: prixbornes

    steps:
      - uses: actions/checkout@v5

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply each migration in order (first pass)
        run: |
          set -euo pipefail
          shopt -s nullglob
          MIGRATIONS=(supabase/migrations/[0-9][0-9][0-9][0-9]_*.sql)
          if [ "${#MIGRATIONS[@]}" -eq 0 ]; then
            echo "No migrations found."
            exit 1
          fi
          for f in "${MIGRATIONS[@]}"; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Re-apply each migration (idempotency assertion)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in supabase/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            echo "Re-applying $f (must succeed clean)"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Sanity — list live.* tables
        run: |
          psql -v ON_ERROR_STOP=1 -c "\dt live.*"

      - name: Sanity — seed rows present after re-apply
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "SELECT slug, kind FROM live.payment_methods ORDER BY slug;"
          COUNT=$(psql -tA -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM live.payment_methods;")
          if [ "$COUNT" != "10" ]; then
            echo "ERROR: expected 10 payment_methods seed rows, got $COUNT"
            exit 1
          fi
          echo "10 seed rows preserved across two applies"
